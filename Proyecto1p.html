<html>
<head>
<style>

table, th, td {
  border: 3px solid black;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
}

th, td {
  background-color: #6E8C49;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #F54927;
}

body {
  margin: 50px;
}

img {
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 5px;
  width: 100px;
}

img:hover {
  box-shadow: 0 0 2px 1px rgba(0, 150, 180, 0.5);
}

.img-container {
  width: 160px;
  height: 160px;
  margin: auto;
  overflow: hidden;
}

.img-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

</style>
</head>

<body>

<table>
  <tr>
    <th>ANIMALES</th>
    <th>DESCRIPCIÓN</th>
    <th>IMAGEN</th>
  </tr>

  <tr>
    <td>Buho</td>
    <td>Un búho es un ave rapaz nocturna...</td>
    <td><img src="https://www.dondevive.org/wp-content/uploads/2015/07/donde-vive-el-buho.jpg"></td>
  </tr>

  <tr>
    <td>Lince</td>
    <td>También conocido como gato montés...</td>
    <td><img src="https://atlasanimal.com/wp-content/uploads/2021/02/lince.jpg"></td>
  </tr>

  <tr>
    <td>Elefante</td>
    <td>Un elefante es el mamífero terrestre...</td>
    <td><img src="https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg"></td>
  </tr>

  <tr>
    <td>Medusa</td>
    <td>Una medusa es un animal marino...</td>
    <td><img src="https://th.bing.com/th/id/OIP.COgzYpuzuGJxy3yqbFmpWQHaEK"></td>
  </tr>

  <tr>
    <td>Jirafa</td>
    <td>Las jirafas son los animales terrestres...</td>
    <td><img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Giraffe_standing.jpg"></td>
  </tr>

</table>

</body>
</html>
